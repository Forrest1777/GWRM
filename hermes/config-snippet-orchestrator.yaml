# The orchestrator may inspect GWRM and run/collect validation.
# Workers remain the default owners of worktree lifecycle and graphical input.

mcp_servers:
  gwrm:
    type: streamable_http
    url: http://host.docker.internal:8123/mcp
    headers:
      X-API-Key: <GWRM_API_KEY>
    connect_timeout: 60
    timeout: 900
    tools:
      include:
        - gwrm_status
        - get_worktree_status
        - run_gut_tests
        - run_gut_test_script
        - get_gut_run_status
        - gui_status
      resources: false
      prompts: false
